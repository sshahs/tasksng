[package]
name = "tasks-core"
description = "CalDAV (Baikal) task sync engine for TasksNG"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
chrono.workspace = true
log.workspace = true
chrono-tz = "0.10"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "gzip", "http2", "system-proxy"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
percent-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tempfile = "3"
