[package]
name = "tasksng"
description = "A fast task manager for Baikal (CalDAV) servers"
version.workspace = true
edition.workspace = true
default-run = "tasksng"

[lib]
name = "tasksng_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tasks-core = { path = "../crates/tasks-core" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
# native-tls: reuse Windows' SChannel and certificate store like the sync client.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
reqwest = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
