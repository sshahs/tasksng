name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (core + UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: core

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, dom, xml, mbstring
          tools: composer

      - name: Frontend checks
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Core unit tests
        run: cargo test -p tasks-core

      - name: End-to-end tests against a Baikal (sabre/dav) server
        working-directory: tools/baikal-dev-server
        run: |
          composer install --no-interaction --no-progress
          BAIKAL_DB=/tmp/digest.sqlite php -S 127.0.0.1:8800 router.php > /tmp/digest.log 2>&1 &
          BAIKAL_AUTH=Basic BAIKAL_DB=/tmp/basic.sqlite php -S 127.0.0.1:8801 router.php > /tmp/basic.log 2>&1 &
          sleep 2
          cd ../..
          TASKSNG_TEST_URL=http://127.0.0.1:8800 cargo test -p tasks-core --test baikal -- --test-threads=1
          TASKSNG_TEST_URL=http://127.0.0.1:8801 cargo test -p tasks-core --test baikal -- --test-threads=1

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Install dependencies
        run: npm ci

      - name: Build app and installers
        run: npx tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/
          Copy-Item target/release/bundle/msi/*.msi out/
          Copy-Item target/release/tasksng.exe out/TasksNG-portable.exe
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: TasksNG-windows-x64
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
