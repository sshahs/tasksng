name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (e.g. 0.2.0). Leave empty for a normal build."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Set for release builds: a pushed vX.Y.Z tag, or a manual run with a version.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_version && format('v{0}', inputs.release_version) || '') }}

jobs:
  test:
    name: Tests (core + UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: core

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, dom, xml, mbstring
          tools: composer

      - name: Frontend checks
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Core unit tests
        run: cargo test -p tasks-core

      - name: End-to-end tests against a Baikal (sabre/dav) server
        working-directory: tools/baikal-dev-server
        run: |
          composer install --no-interaction --no-progress
          BAIKAL_DB=/tmp/digest.sqlite php -S 127.0.0.1:8800 router.php > /tmp/digest.log 2>&1 &
          BAIKAL_AUTH=Basic BAIKAL_DB=/tmp/basic.sqlite php -S 127.0.0.1:8801 router.php > /tmp/basic.log 2>&1 &
          sleep 2
          cd ../..
          TASKSNG_TEST_URL=http://127.0.0.1:8800 cargo test -p tasks-core --test baikal -- --test-threads=1
          TASKSNG_TEST_URL=http://127.0.0.1:8801 cargo test -p tasks-core --test baikal -- --test-threads=1
          TASKSNG_TEST_URL=http://127.0.0.1:8800 cargo test -p tasks-server

      - name: Server logs
        if: failure()
        run: tail -n 100 /tmp/digest.log /tmp/basic.log || true

  linux:
    name: Linux app (clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev libxdo-dev pkg-config

      - name: Frontend (embedded into the app)
        run: |
          npm ci
          npm run build

      - name: Clippy
        run: cargo clippy -p tasksng -p tasks-server --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p tasksng

      - name: --version works without a display or D-Bus
        run: |
          cargo build -p tasksng
          env -i target/debug/tasksng --version | grep -F "$(node -p 'require("./src-tauri/tauri.conf.json").version')"

  nix:
    name: Nix flake (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      # Pulls from the binary cache and, with the token (not available to pull
      # requests from forks), pushes what this job builds.
      - uses: cachix/cachix-action@v16
        with:
          name: tasksng
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the package
        run: nix build .#default -L

      - name: Smoke test
        run: ./result/bin/tasksng --version

      - name: Flake checks (package, NixOS module)
        run: nix flake check -L

  docker:
    name: Docker image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: tasksng:test
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Smoke test
        run: |
          docker run -d --name tasksng -p 8080:8080 -e TASKSNG_CALDAV_URL=https://dav.example.com tasksng:test
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' tasksng)" = healthy ] && break
            sleep 2
          done
          docker logs tasksng
          [ "$(docker inspect -f '{{.State.Health.Status}}' tasksng)" = healthy ]
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS -X POST -H 'X-TasksNG: 1' http://localhost:8080/api/server_info | grep -q '"caldavUrl":"https://dav.example.com"'
          [ "$(docker exec tasksng id -u)" != 0 ]

      - name: Log in to the GitHub container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (by digest; tagged in docker-publish)
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Publish Docker image
    needs: [test, docker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # main: latest, main and sha-…; releases: X.Y.Z and X.Y as well.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || env.RELEASE_TAG != '' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}

      - name: Create the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Install dependencies
        run: npm ci

      - name: Build app and installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/release-config.mjs
          npx tauri build --config src-tauri/tauri.ci.conf.json

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp target/release/bundle/nsis/*-setup.exe target/release/bundle/msi/*.msi out/
          cp target/release/tasksng.exe out/TasksNG-portable.exe
          if [[ -n "$RELEASE_TAG" ]]; then
            cp target/release/bundle/nsis/*-setup.exe.sig target/release/bundle/msi/*.msi.sig out/
          fi
          # The MSI is British English (src-tauri/wix/en-GB.wxl) but Tauri names
          # it after its en-US config key.
          for f in out/*_en-US.msi*; do mv "$f" "${f/_en-US/_en-GB}"; done
          if [[ -n "$RELEASE_TAG" ]]; then
            node scripts/updater-manifest.mjs out
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: TasksNG-windows-x64
          path: out/*
          if-no-files-found: error

      # Notes come from docs/release-notes/X.Y.Z.md when it exists; GitHub
      # appends the list of changes either way.
      - name: Release notes
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          notes="docs/release-notes/${RELEASE_TAG#v}.md"
          if [[ -f "$notes" ]]; then cp "$notes" release-notes.md; else : > release-notes.md; fi

      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: TasksNG ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: out/*
          generate_release_notes: true
