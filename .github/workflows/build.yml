name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (e.g. 0.2.0). Leave empty for a normal build."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Set for release builds: a pushed vX.Y.Z tag, or a manual run with a version.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_version && format('v{0}', inputs.release_version) || '') }}

jobs:
  test:
    name: Tests (core + UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: core

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, dom, xml, mbstring
          tools: composer

      - name: Frontend checks
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Core unit tests
        run: cargo test -p tasks-core

      - name: End-to-end tests against a Baikal (sabre/dav) server
        working-directory: tools/baikal-dev-server
        run: |
          composer install --no-interaction --no-progress
          BAIKAL_DB=/tmp/digest.sqlite php -S 127.0.0.1:8800 router.php > /tmp/digest.log 2>&1 &
          BAIKAL_AUTH=Basic BAIKAL_DB=/tmp/basic.sqlite php -S 127.0.0.1:8801 router.php > /tmp/basic.log 2>&1 &
          sleep 2
          cd ../..
          TASKSNG_TEST_URL=http://127.0.0.1:8800 cargo test -p tasks-core --test baikal -- --test-threads=1
          TASKSNG_TEST_URL=http://127.0.0.1:8801 cargo test -p tasks-core --test baikal -- --test-threads=1

      - name: Server logs
        if: failure()
        run: tail -n 100 /tmp/digest.log /tmp/basic.log || true

  linux:
    name: Linux app (clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev libxdo-dev pkg-config

      - name: Frontend (embedded into the app)
        run: |
          npm ci
          npm run build

      - name: Clippy
        run: cargo clippy -p tasksng --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p tasksng

      - name: --version works without a display or D-Bus
        run: |
          cargo build -p tasksng
          env -i target/debug/tasksng --version | grep -F "$(node -p 'require("./src-tauri/tauri.conf.json").version')"

  nix:
    name: Nix flake (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      # Pulls from the binary cache and, with the token (not available to pull
      # requests from forks), pushes what this job builds.
      - uses: cachix/cachix-action@v16
        with:
          name: tasksng
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the package
        run: nix build .#default -L

      - name: Smoke test
        run: ./result/bin/tasksng --version

      - name: Flake checks (package, NixOS module)
        run: nix flake check -L

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Install dependencies
        run: npm ci

      - name: Build app and installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/release-config.mjs
          npx tauri build --config src-tauri/tauri.ci.conf.json

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp target/release/bundle/nsis/*-setup.exe target/release/bundle/msi/*.msi out/
          cp target/release/tasksng.exe out/TasksNG-portable.exe
          if [[ -n "$RELEASE_TAG" ]]; then
            cp target/release/bundle/nsis/*-setup.exe.sig target/release/bundle/msi/*.msi.sig out/
          fi
          # The MSI is British English (src-tauri/wix/en-GB.wxl) but Tauri names
          # it after its en-US config key.
          for f in out/*_en-US.msi*; do mv "$f" "${f/_en-US/_en-GB}"; done
          if [[ -n "$RELEASE_TAG" ]]; then
            node scripts/updater-manifest.mjs out
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: TasksNG-windows-x64
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: TasksNG ${{ env.RELEASE_TAG }}
          files: out/*
          generate_release_notes: true
