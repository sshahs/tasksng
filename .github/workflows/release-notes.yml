# Sets a published release's notes from docs/release-notes/<version>.md, for
# fixing or adding notes after a release without rebuilding it. (New
# releases pick that file up by themselves.)
name: Release notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.4.0"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            *[!0-9.]*|'') echo "Not a version: $VERSION" >&2; exit 1 ;;
          esac
          notes="docs/release-notes/$VERSION.md"
          [ -f "$notes" ] || { echo "Missing $notes" >&2; exit 1; }
          previous=$(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep -vx "v$VERSION" | head -1)
          {
            cat "$notes"
            if [ -n "$previous" ]; then
              printf '\n**Full changelog**: https://github.com/%s/compare/%s...v%s\n' "$GITHUB_REPOSITORY" "$previous" "$VERSION"
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
